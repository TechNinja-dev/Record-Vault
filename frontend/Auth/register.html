<!-- Auth/register.html -->
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Record Vault</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Prevent dark-mode flash -->
  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      const dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body
  data-page="register"
  class="min-h-screen bg-slate-50 text-slate-900 antialiased flex flex-col justify-between
         dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200"
>

  <!-- ── Injected Navbar ──────────────────────────────────── -->
  <div id="navbar"></div>

  <!-- ── Main Auth Section ────────────────────────────────── -->
  <main class="relative flex-1 flex items-center justify-center px-4 py-10 sm:px-6 lg:px-8 overflow-hidden">
    <!-- Ambient background glow matching Home aesthetic -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10">
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 h-80 w-[36rem] rounded-full
                  bg-indigo-300/30 blur-3xl dark:bg-indigo-600/15"></div>
      <div class="absolute bottom-10 left-10 h-64 w-64 rounded-full
                  bg-emerald-200/30 blur-3xl dark:bg-emerald-500/10"></div>
    </div>

    <!-- Auth Card -->
    <div class="w-full max-w-md">
      <div class="rounded-2xl border border-slate-200/80 bg-white/95 p-6 shadow-xl backdrop-blur-md
                  sm:p-8 sm:rounded-3xl dark:border-slate-800/80 dark:bg-slate-900/90 dark:shadow-2xl dark:shadow-black/40">

        <!-- Header -->
        <div class="text-center">
          <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-md shadow-indigo-600/20 mb-4">
            <span class="text-xl font-bold">₹</span>
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-3xl">
            Create an account
          </h1>
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
            Start managing and tracking your finances in seconds
          </p>
        </div>

        <!-- Segmented Tab Switcher -->
        <div class="mt-6 flex rounded-xl bg-slate-100 p-1 dark:bg-slate-800">
          <a
            id="tab-login"
            href="login.html"
            class="flex-1 rounded-lg py-2 text-center text-xs font-medium text-slate-500 transition
                   hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
          >
            Sign In
          </a>
          <a
            id="tab-register"
            href="register.html"
            class="flex-1 rounded-lg py-2 text-center text-xs font-semibold transition
                   bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white"
          >
            Create Account
          </a>
        </div>

        <!-- Google Auth Button -->
        <div class="mt-4">
          <button
            id="btn-google-auth"
            type="button"
            class="group relative flex w-full items-center justify-center gap-3 rounded-xl border border-slate-300
                   bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-150
                   hover:bg-slate-50 hover:border-slate-400 focus:outline-none focus-visible:ring-2
                   focus-visible:ring-indigo-500 focus-visible:ring-offset-2 active:scale-[0.99]
                   dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-750 dark:hover:border-slate-600
                   dark:focus-visible:ring-offset-slate-900"
          >
            <!-- Google Multicolor "G" Logo -->
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Sign up with Google</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="relative my-6 flex items-center">
          <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
          <span class="mx-3 flex-shrink text-xs uppercase tracking-wider text-slate-400 dark:text-slate-500 font-medium">
            or sign up with email
          </span>
          <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        </div>

        <!-- Register Form -->
        <form id="form-register" class="space-y-4" autocomplete="on">
          <!-- Full Name Field -->
          <div>
            <label for="reg-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Full name
            </label>
            <div class="relative mt-1.5">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </span>
              <input
                id="reg-name"
                name="name"
                type="text"
                required
                placeholder="John Doe"
                class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400
                       shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20
                       dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder-slate-500"
              />
            </div>
          </div>

          <!-- Email Field -->
          <div>
            <label for="reg-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Email address
            </label>
            <div class="relative mt-1.5">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </span>
              <input
                id="reg-email"
                name="email"
                type="email"
                required
                placeholder="you@example.com"
                class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400
                       shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20
                       dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder-slate-500"
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label for="reg-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <div class="relative mt-1.5">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </span>
              <input
                id="reg-password"
                name="password"
                type="password"
                required
                minlength="6"
                placeholder="At least 6 characters"
                class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-10 text-sm text-slate-900 placeholder-slate-400
                       shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20
                       dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder-slate-500"
              />
              <!-- Password Toggle -->
              <button
                type="button"
                data-toggle-target="reg-password"
                class="btn-toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                aria-label="Toggle password visibility"
              >
                <!-- Eye Open Icon -->
                <svg class="icon-eye-open h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- Eye Closed Icon -->
                <svg class="icon-eye-closed hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div>
            <label for="reg-password-confirm" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Confirm password
            </label>
            <div class="relative mt-1.5">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
              </span>
              <input
                id="reg-password-confirm"
                name="confirm_password"
                type="password"
                required
                minlength="6"
                placeholder="Re-enter password"
                class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-10 text-sm text-slate-900 placeholder-slate-400
                       shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20
                       dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder-slate-500"
              />
              <!-- Password Toggle -->
              <button
                type="button"
                data-toggle-target="reg-password-confirm"
                class="btn-toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                aria-label="Toggle confirm password visibility"
              >
                <!-- Eye Open Icon -->
                <svg class="icon-eye-open h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- Eye Closed Icon -->
                <svg class="icon-eye-closed hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="flex items-start">
            <input
              id="reg-terms"
              name="terms"
              type="checkbox"
              required
              class="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500
                     dark:border-slate-700 dark:bg-slate-900 dark:focus:ring-offset-slate-900"
            />
            <label for="reg-terms" class="ml-2 block text-xs text-slate-600 dark:text-slate-400">
              I agree to the <a href="#" class="text-indigo-600 dark:text-indigo-400 underline">Terms of Service</a> and <a href="#" class="text-indigo-600 dark:text-indigo-400 underline">Privacy Policy</a>
            </label>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="btn-register-submit"
            class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white
                   shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-2
                   focus-visible:ring-indigo-500 focus-visible:ring-offset-2 active:scale-[0.99] dark:focus-visible:ring-offset-slate-950"
          >
            <span>Create Account</span>
            <svg class="h-4 w-4 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
          </button>
        </form>

        <!-- Switch Link -->
        <p class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
          Already have an account?
          <a
            href="login.html"
            class="font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300 transition"
          >
            Sign in
          </a>
        </p>

      </div>
    </div>
  </main>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <footer class="border-t border-slate-200/60 dark:border-slate-800/60 py-4 text-center text-xs text-slate-400 dark:text-slate-500">
    <p>© 2026 Record Vault · Safe & encrypted personal finance</p>
  </footer>

  <!-- ── Scripts ─────────────────────────────────────────── -->
  <!-- Reusable Navbar loader -->
  <script src="../Navbar/navbar.js"></script>
  <!-- Auth UI & Functionality -->
  <script src="auth.js"></script>

</body>
</html>
